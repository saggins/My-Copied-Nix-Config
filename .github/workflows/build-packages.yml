name: Build 🏗️ Packages ️📦

# These jobs run on the self-hosted workhorse runner and this repo is public,
# so pull_request builds are limited to the lock updater's PR (see the job
# guards), and fork PRs need approval before any workflow runs.
on:
  push:
    branches:
      - main
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'lib/**'
      - 'pkgs/**'
      - 'overlays/**'
  pull_request:
    branches:
      - main
    paths:
      - 'flake.nix'
      - 'flake.lock'
      - 'lib/**'
      - 'pkgs/**'
      - 'overlays/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build-fuzzel-menus:
    name: 📄
    # Only the lock updater's PR, never forks: these run on the self-hosted runner
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update_flake_lock_action')
    runs-on: [self-hosted, workhorse]
    strategy:
      matrix:
        package:
          - bzmenu
          - iwmenu
    env:
      # GC root so the latest build survives garbage collection on workhorse
      OUT_LINK: /nix/var/nix/gcroots/ci/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.package }}
        run: |
          nix build .#${{ matrix.package }}.packages.x86_64-linux.default -L --out-link "${OUT_LINK}"
      - name: sbomnix
        run: |
          name="${{ github.job }}-${{ matrix.package }}"
          nix run github:tiiuae/sbomnix#sbomnix -- \
            --csv "${name}.sbom.csv" \
            --cdx "${name}.sbom.cdx.json" \
            --spdx "${name}.sbom.spdx.json" \
            "${OUT_LINK}"
      - name: vulnxscan
        run: |
          name="${{ github.job }}-${{ matrix.package }}"
          nix run github:tiiuae/sbomnix#vulnxscan -- \
            --triage \
            --sbom "${name}.sbom.cdx.json"
          if [ -e vulns.triage.csv ]; then
            grep -v -E "not_vulnerable|fix_not_available" vulns.triage.csv > cve.csv
            if [ $(wc -l < cve.csv) -gt 1 ]; then
              nix run github:nixos/nixpkgs#csv2md -- --columns "0-7,9" cve.csv | tee "${name}.vulnxscan.md"
              echo "### Vulnerability Scan Results for ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat "${name}.vulnxscan.md" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      - name: Upload vulnxscan report
        uses: actions/upload-artifact@v4
        with:
          name: vulnxscan-${{ github.job }}-${{ matrix.package }}
          path: "*.vulnxscan.md"
          if-no-files-found: ignore

  build-fonts:
    name: 🔤
    # Only the lock updater's PR, never forks: these run on the self-hosted runner
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update_flake_lock_action')
    runs-on: [self-hosted, workhorse]
    strategy:
      matrix:
        package:
          - bebas-neue-2014-font
          - bebas-neue-pro-font
          - bebas-neue-rounded-font
          - bebas-neue-semi-rounded-font
          - boycott-font
          - commodore-64-pixelized-font
          - digital-7-font
          - dirty-ego-font
          - fixedsys-core-font
          - fixedsys-excelsior-font
          - impact-label-font
          - mocha-mattari-font
          - poppins-font
          - spaceport-2006-font
          - zx-spectrum-7-font
    env:
      # GC root so the latest build survives garbage collection on workhorse
      OUT_LINK: /nix/var/nix/gcroots/ci/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - name: ${{ matrix.package }}
        run: |
          nix build .#${{ matrix.package }} -L --out-link "${OUT_LINK}"
      - name: sbomnix
        run: |
          name="${{ github.job }}-${{ matrix.package }}"
          nix run github:tiiuae/sbomnix#sbomnix -- \
            --csv "${name}.sbom.csv" \
            --cdx "${name}.sbom.cdx.json" \
            --spdx "${name}.sbom.spdx.json" \
            "${OUT_LINK}"
      - name: vulnxscan
        run: |
          name="${{ github.job }}-${{ matrix.package }}"
          nix run github:tiiuae/sbomnix#vulnxscan -- \
            --triage \
            --sbom "${name}.sbom.cdx.json"
          if [ -e vulns.triage.csv ]; then
            grep -v -E "not_vulnerable|fix_not_available" vulns.triage.csv > cve.csv
            if [ $(wc -l < cve.csv) -gt 1 ]; then
              nix run github:nixos/nixpkgs#csv2md -- --columns "0-7,9" cve.csv | tee "${name}.vulnxscan.md"
              echo "### Vulnerability Scan Results for ${{ matrix.package }}" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              cat "${name}.vulnxscan.md" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      - name: Upload vulnxscan report
        uses: actions/upload-artifact@v4
        with:
          name: vulnxscan-${{ github.job }}-${{ matrix.package }}
          path: "*.vulnxscan.md"
          if-no-files-found: ignore

  vuln-report:
    name: 🛡️
    needs: [build-fuzzel-menus, build-fonts]
    # Skip for lock PR builds; report once the update lands on main
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/vuln-report.yml
    with:
      title: "vulnxscan: Packages"
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
