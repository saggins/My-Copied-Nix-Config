name: Build 🏗️ Servers ️💁
on:
  push:
    branches:
      - main
    paths:
      - 'flake.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'flake.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build-server:
    name: 💁
    # Only the lock updater's PR, never forks: these run on the self-hosted runner
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update_flake_lock_action')
    # Builds land in workhorse's /nix/store, served to the other hosts by nix-serve
    runs-on: [self-hosted, workhorse]
    strategy:
      matrix:
        host:
          - workhorse
          - bastion
        config-type:
          - type: 'nixos'
            path: '.#nixosConfigurations.{host}.config.system.build.toplevel'
          - type: 'home'
            path: '.#homeConfigurations."sangmin@{host}".activationPackage'
    env:
      # GC root so the latest build survives garbage collection on workhorse
      OUT_LINK: /nix/var/nix/gcroots/ci/${{ matrix.host }}-${{ matrix.config-type.type }}
    steps:
    - uses: actions/checkout@v7
    - name: ${{ matrix.host }} - ${{ matrix.config-type.type }}
      run: |
        FLAKEREF="${{ matrix.config-type.path }}"
        FLAKEREF="${FLAKEREF/\{host\}/${{ matrix.host }}}"
        nix build ${FLAKEREF} -L --out-link "${OUT_LINK}"
    - name: sbomnix
      run: |
        name="${{ matrix.host }}-${{ matrix.config-type.type }}"
        nix run github:tiiuae/sbomnix#sbomnix -- \
          --csv "${name}.sbom.csv" \
          --cdx "${name}.sbom.cdx.json" \
          --spdx "${name}.sbom.spdx.json" \
          "${OUT_LINK}"
    - name: vulnxscan
      run: |
        name="${{ matrix.host }}-${{ matrix.config-type.type }}"
        nix run github:tiiuae/sbomnix#vulnxscan -- \
          --sbom "${name}.sbom.cdx.json" \
          --out vulns.csv
        # sbomnix 2.x dropped --triage and vulns.triage.csv; render the
        # report columns ourselves, dropping whitelisted rows
        nix run github:nixos/nixpkgs#python3 -- -c '
          import csv, sys
          rows = list(csv.reader(open("vulns.csv")))
          head, data = rows[0], rows[1:]
          head = [n.replace("version_local", "version") for n in head]
          want = ["vuln_id", "url", "package", "version", "severity", "grype", "osv", "vulnix", "sum"]
          wl = head.index("whitelist") if "whitelist" in head else -1
          sel = [head.index(n) for n in want if n in head]
          w = csv.writer(sys.stdout)
          w.writerow([head[i] for i in sel])
          for row in data:
            if wl == -1 or row[wl] != "True":
              w.writerow([row[i] for i in sel])
        ' > cve.csv
        if [ $(wc -l < cve.csv) -gt 1 ]; then
          nix run github:nixos/nixpkgs#csv2md -- cve.csv | tee "${name}.vulnxscan.md"
          echo "### Vulnerability Scan Results for ${{ matrix.host }}-${{ matrix.config-type.type }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          cat "${name}.vulnxscan.md" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
    - name: Upload vulnxscan report
      uses: actions/upload-artifact@v7
      with:
        name: vulnxscan-${{ matrix.host }}-${{ matrix.config-type.type }}
        path: "*.vulnxscan.md"
        if-no-files-found: ignore

  vuln-report:
    name: 🛡️
    needs: [build-server]
    # Skip for lock PR builds; report once the update lands on main
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/vuln-report.yml
    with:
      title: "vulnxscan: Servers"
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
