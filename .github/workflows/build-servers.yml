name: Build 🏗️ Servers ️💁
on:
  push:
    branches:
      - main
    paths:
      - 'flake.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  build-server:
    name: 💁
    # Builds land in workhorse's /nix/store, served to the other hosts by nix-serve
    runs-on: [self-hosted, workhorse]
    strategy:
      matrix:
        host:
          - workhorse
          - bastion
        config-type:
          - type: 'nixos'
            path: '.#nixosConfigurations.{host}.config.system.build.toplevel'
          - type: 'home'
            path: '.#homeConfigurations."sangmin@{host}".activationPackage'
    env:
      # GC root so the latest build survives garbage collection on workhorse
      OUT_LINK: /nix/var/nix/gcroots/ci/${{ matrix.host }}-${{ matrix.config-type.type }}
    steps:
    - uses: actions/checkout@v5
    - name: ${{ matrix.host }} - ${{ matrix.config-type.type }}
      run: |
        FLAKEREF="${{ matrix.config-type.path }}"
        FLAKEREF="${FLAKEREF/\{host\}/${{ matrix.host }}}"
        nix build ${FLAKEREF} -L --out-link "${OUT_LINK}"
    - name: sbomnix
      run: |
        name="${{ matrix.host }}-${{ matrix.config-type.type }}"
        nix run github:tiiuae/sbomnix#sbomnix -- \
          --csv "${name}.sbom.csv" \
          --cdx "${name}.sbom.cdx.json" \
          --spdx "${name}.sbom.spdx.json" \
          "${OUT_LINK}"
    - name: vulnxscan
      run: |
        name="${{ matrix.host }}-${{ matrix.config-type.type }}"
        nix run github:tiiuae/sbomnix#vulnxscan -- \
          --triage \
          --sbom "${name}.sbom.cdx.json"
        if [ -e vulns.triage.csv ]; then
          grep -v -E "not_vulnerable|fix_not_available" vulns.triage.csv > cve.csv
          if [ $(wc -l < cve.csv) -gt 1 ]; then
            nix run github:nixos/nixpkgs#csv2md -- --columns "0-7,9" cve.csv | tee "${name}.vulnxscan.md"
            echo "### Vulnerability Scan Results for ${{ matrix.host }}-${{ matrix.config-type.type }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "${name}.vulnxscan.md" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
        fi
    - name: Upload vulnxscan report
      uses: actions/upload-artifact@v4
      with:
        name: vulnxscan-${{ matrix.host }}-${{ matrix.config-type.type }}
        path: "*.vulnxscan.md"
        if-no-files-found: ignore

  vuln-report:
    name: 🛡️
    needs: [build-server]
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/vuln-report.yml
    with:
      title: "vulnxscan: Servers"
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
