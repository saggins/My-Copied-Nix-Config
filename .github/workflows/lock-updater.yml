name: Flake ❄️ Lock 🔒️ Updater ✨

on:
  schedule:
    # Pi o'clock
    - cron: '14 3 * * *'
  workflow_dispatch:

jobs:
  lock-updater:
    name: Flake Lock Updater
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      - uses: wimpysworld/nothing-but-nix@main
        with:
          hatchet-protocol: 'holster'
      - uses: DeterminateSystems/determinate-nix-action@v3
        with:
          extra-conf: |
            lazy-trees = true
      - uses: DeterminateSystems/update-flake-lock@v29
        with:
          # A PAT, not GITHUB_TOKEN: PRs opened with GITHUB_TOKEN don't trigger
          # other workflows, and the builds should run on this PR
          token: ${{ secrets.FLAKE_LOCK_TOKEN }}
          pr-title: "chore: update flake.lock"
          # Labels to be set on the PR
          pr-labels: |
            dependencies
            automated
