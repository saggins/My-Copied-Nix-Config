name: Build 🏗️ Darwin 🍏
on:
  push:
    branches:
      - main
    paths:
      - 'flake.lock'
  pull_request:
    branches:
      - main
    paths:
      - 'flake.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  id-token: write

jobs:
  build-darwin:
    name: 🍏
    # Only the lock updater's PR, never forks: these run on the self-hosted runner
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'update_flake_lock_action')
    runs-on: macos-latest
    strategy:
      matrix:
        host:
          - dorado
        config-type:
          - type: 'darwin'
            path: '.#darwinConfigurations.{host}.config.system.build.toplevel'
          - type: 'home'
            path: '.#homeConfigurations."sangmin@{host}".activationPackage'
    steps:
    - uses: actions/checkout@v7
    - uses: DeterminateSystems/determinate-nix-action@v3
      with:
        extra-conf: |
          lazy-trees = true
    - name: ${{ matrix.host }} - ${{ matrix.config-type.type }}
      run: |
        FLAKEREF="${{ matrix.config-type.path }}"
        FLAKEREF="${FLAKEREF/\{host\}/${{ matrix.host }}}"
        nix build ${FLAKEREF} -L
    - name: sbomnix
      run: |
        name="${{ matrix.host }}-${{ matrix.config-type.type }}"
        nix run github:tiiuae/sbomnix#sbomnix -- \
          --csv "${name}.sbom.csv" \
          --cdx "${name}.sbom.cdx.json" \
          --spdx "${name}.sbom.spdx.json" \
          ./result
    - name: vulnxscan
      run: |
        name="${{ matrix.host }}-${{ matrix.config-type.type }}"
        nix run github:tiiuae/sbomnix#vulnxscan -- \
          --triage \
          --sbom "${name}.sbom.cdx.json"
        if [ -e vulns.triage.csv ]; then
          grep -v -E "not_vulnerable|fix_not_available" vulns.triage.csv > cve.csv
          if [ $(wc -l < cve.csv) -gt 1 ]; then
            nix run github:nixos/nixpkgs#csv2md -- --columns "0-7,9" cve.csv | tee "${name}.vulnxscan.md"
            echo "### Vulnerability Scan Results for ${{ matrix.host }}-${{ matrix.config-type.type }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            cat "${name}.vulnxscan.md" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi
        fi
    - name: Upload vulnxscan report
      uses: actions/upload-artifact@v4
      with:
        name: vulnxscan-${{ matrix.host }}-${{ matrix.config-type.type }}
        path: "*.vulnxscan.md"
        if-no-files-found: ignore

  vuln-report:
    name: 🛡️
    needs: [build-darwin]
    # Skip for lock PR builds; report once the update lands on main
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/vuln-report.yml
    with:
      title: "vulnxscan: Darwin"
    secrets: inherit
    permissions:
      contents: read
      issues: write
      id-token: write
