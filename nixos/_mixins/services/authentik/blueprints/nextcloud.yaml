# OIDC provider and application for Nextcloud (services/nextcloud, user_oidc app). The
# client secret comes from the authentik env file and must match the one Nextcloud reads.
version: 1
metadata:
  name: nix - nextcloud
entries:
  # Nextcloud makes users admins through its "admin" group, so hand members of
  # "authentik Admins" that group too. user_oidc reads this claim via --mapping-groups.
  - model: authentik_providers_oauth2.scopemapping
    id: nextcloud-scope
    state: present
    identifiers:
      name: "Nextcloud: groups"
    attrs:
      scope_name: nextcloud
      description: "Nextcloud groups"
      expression: |
        groups = [group.name for group in request.user.groups.all()]
        if "authentik Admins" in groups:
            groups.append("admin")
        return {"nextcloud_groups": groups}
  - model: authentik_providers_oauth2.oauth2provider
    id: nextcloud-provider
    state: present
    identifiers:
      name: Nextcloud
    attrs:
      client_type: confidential
      client_id: nextcloud
      client_secret: !Env NEXTCLOUD_OIDC_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      redirect_uris:
        - matching_mode: strict
          url: https://workhorse.comet-court.ts.net:8447/apps/user_oidc/code
          redirect_uri_type: authorization
      # Defaults to empty (nothing allowed) when created from a blueprint
      grant_types:
        - authorization_code
        - refresh_token
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]
        - !KeyOf nextcloud-scope
  - model: authentik_core.application
    state: present
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      provider: !KeyOf nextcloud-provider
      meta_launch_url: https://workhorse.comet-court.ts.net:8447/
